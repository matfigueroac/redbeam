[package]
name = "redbim"
version = "0.1.0"
edition = "2024"
description = "RedBIM - Visor, marcado y cubicación de planos PDF nativo para Windows (enfoque métrico chileno e imperial)"
license = "MIT"

[dependencies]
eframe = "0.37.0"
hayro = "0.9.0"
lopdf = "0.47.0"
rfd = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
directories = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
